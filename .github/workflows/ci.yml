name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main
      - improve-project-readme-and-config

jobs:

  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw clean verify


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config -q

      - name: Build application images
        run: docker compose --env-file .env.example build backend frontend

      - name: Start stack and check authenticated API
        run: |
          docker compose --env-file .env.example up -d
          set -a
          . ./.env.example
          set +a
          for attempt in $(seq 1 40); do
            if curl -fsS -u "$APP_ADMIN_USERNAME:$APP_ADMIN_PASSWORD" http://localhost:8080/api/auth/me | jq -e '.role == "ADMIN"' >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env.example logs --tail=80 backend mysql
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.example down
